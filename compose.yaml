services:
  rdl-converter:
    build: .
    image: rdl-converter-service:local
    ports:
      - "127.0.0.1:7070:7070"
    environment:
      RDL_STRICT_FONTS: "true"
      RDL_MAX_CONCURRENCY: "2"
      RDL_RENDER_TIMEOUT_MS: "120000"
      RDL_WORKER_MEMORY_MB: "512"
    volumes:
      - "${RDL_FONT_HOST_DIR:?Set RDL_FONT_HOST_DIR to the licensed font directory}:/app/fonts:ro"
    read_only: true
    tmpfs:
      - /tmp/rdl-converter:rw,noexec,nosuid,nodev,mode=0700,size=1g,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7070/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
